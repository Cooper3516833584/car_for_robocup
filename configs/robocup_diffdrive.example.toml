# WARNING: This is not a deployable car profile. The physical track and left
# shell dimensions below are reported measurements; the effective track and
# T265 optical-origin offset remain provisional. Check geometry and mounts
# on the actual car before motion testing.
schema_version = 2
robot_name = "robocup_diffdrive"

[calibration]
c10b_diff_firmware_verified = false

[vehicle.geometry]
drive_track_width_m = 0.200
wheel_diameter_m = 0.100
body_length_m = 0.450
body_width_m = 0.3596
drive_axle_to_body_center_x_m = 0.000
front_support_x_m = 0.180
rear_support_x_m = -0.180

[vehicle.drive]
kinematics = "differential"
protocol_mode = "ackermann_firmware_compat"
max_wheel_speed_m_s = 0.30
max_linear_speed_m_s = 0.20
max_angular_speed_rad_s = 0.80
max_linear_accel_m_s2 = 0.30
max_angular_accel_rad_s2 = 1.00
command_timeout_s = 0.25
firmware_track_width_m = 0.164
firmware_min_turn_radius_m = 0.350
allow_in_place_rotation = true

[devices.c10b]
port = "COM3"
baudrate = 115200

[devices.d500]
enabled = true
port = "COM4"
baudrate = 230400

[sensors.d500.mount]
x_m = 0.0
y_m = 0.0
z_m = 0.20
roll_rad = 0.0
pitch_rad = 0.0
yaw_rad = 0.0

[sensors.d500.localization]
enable_icp = true
enable_wall_absolute = true
require_global_for_hardware = true
# Placeholder field extent and wall references. Survey the actual barriers.
reference_measured = false
field_width_m = 10.0
field_height_m = 10.0
back_wall_x_m = 0.0
right_wall_y_m = 0.0
# Only back/right reference walls are assumed by default; opt in to others when verified.
use_front_wall = false
use_left_wall = false
min_confidence = 0.65
max_position_jump_m = 0.50
max_yaw_jump_rad = 0.35

[devices.t265]
enabled = true
serial = ""

# LCUS USB relay (CH340, fixed 9600 8N1) used as a payload switch. Disabled by
# default: enable it only after the port has been pinned with a udev rule, since
# CH340 has the same USB ID as the HC-14 radio and /dev/ttyUSB* numbering moves.
# Contacts stay latched after the process exits; the runtime requests all_off on
# shutdown. See docs/RELAY_LCUS.md.
[devices.relay]
enabled = false
port = ""                    # e.g. "/dev/relay_lcus"
baudrate = 9600
channel_count = 8            # 4 or 8 depending on the fitted board
read_timeout_s = 0.2
query_timeout_s = 1.0
verify_writes = true         # read back the state after every switch command
disconnect_on_shutdown = true

[sensors.t265.mount]
# Upright left-facing camera, housing centered on the drive axle. Initial
# optical-origin estimate only: inner shell y=0.1678 m plus 5.95 mm depth;
# x uses the 9.10 mm offset rotated from the former rear-facing mount.
x_m = -0.00910
y_m = 0.17375
z_m = 0.03225
roll_rad = 0.0
pitch_rad = 0.0
yaw_rad = 1.5707963267948966

[fusion]
t265_max_age_s = 0.15
d500_max_age_s = 0.50
t265_min_tracker_confidence = 2

[localization]
# Keep the existing backend until shadow runs and hardware acceptance complete.
backend = "legacy"

[localization.slam]
enabled = false
require_field_anchor = true
# Set true only after recorded localization, CPU and communication acceptance.
hardware_mission_validated = false

[navigation]
position_tolerance_m = 0.03
yaw_tolerance_rad = 0.0523598776
lookahead_m = 0.30
rotate_in_place_threshold_rad = 0.70
slowdown_distance_m = 0.50
path_yaw_gain = 1.5
final_yaw_gain = 1.5
degraded_speed_scale = 0.4

[safety]
require_verified_c10b_diff_firmware_for_curved_motion = true
require_measured_d500_reference_for_hardware_mission = true
stop_if_pose_lost_s = 0.30
hardware_probe_max_linear_speed_m_s = 0.10
hardware_probe_max_angular_speed_rad_s = 0.35
